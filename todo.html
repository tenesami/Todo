<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="todo_style.css" />
</head>

<body>

    <div class="container">
        <h1>To Do List</h1>

        <!-- Add Task Form -->
        <div class="form-box">
            <input type="date" id="date" />
            <input type="text" id="task" placeholder="Task description" />
            <input type="text" id="assigned" placeholder="Assigned to" />
            <button onclick="addTask()">Add Task</button>
        </div>

        <!-- Task Table -->
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Date</th>
                    <th>Task</th>
                    <th>Assigned To</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="taskBody"></tbody>
        </table>
    </div>

    <script src="todo_app.js"></script>
</body>

</html>
